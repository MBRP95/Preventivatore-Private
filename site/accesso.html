<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso — Preventivatore</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff8d6;color:#1c1a14}
  main{max-width:440px;margin:0 auto;padding:48px 20px}
  h1{margin:0 0 6px;font-size:28px}
  p{margin:0 0 18px;color:#4a4638}
  form{background:#fff;border-radius:16px;padding:18px;display:grid;gap:12px}
  label{display:grid;gap:6px;font-weight:700;font-size:14px}
  input{font:inherit;padding:12px;border:1px solid #e2d48a;border-radius:10px}
  button{font:inherit;font-weight:800;background:#FFD000;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
  button.link{background:transparent;color:#3d3a30;font-weight:700;padding:8px 0}
  .err{min-height:1.2em;color:#8a2b2b;font-weight:700}
  a.back{color:#3d3a30}
</style>
</head>
<body>
<main>
  <h1 id="title">Shop Assistant</h1>
  <p id="lead">Password del negozio e PIN del punto vendita.</p>
  <form id="shopForm">
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <label>PIN del negozio<input name="pin" type="password" inputmode="numeric" autocomplete="off" required></label>
    <button type="submit">Entra</button>
  </form>
  <form id="adminForm" hidden>
    <label>Password amministratore<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Entra</button>
  </form>
  <p class="err" id="err"></p>
  <button class="link" id="switchMode" type="button">Accesso amministratore</button>
  <p><a class="back" href="/">Torna alla scelta</a></p>
</main>
<script>
const shopForm = document.getElementById("shopForm");
const adminForm = document.getElementById("adminForm");
const err = document.getElementById("err");
const title = document.getElementById("title");
const lead = document.getElementById("lead");
let admin = new URLSearchParams(location.search).get("admin") === "1";
function paint(){
  shopForm.hidden = admin;
  adminForm.hidden = !admin;
  title.textContent = admin ? "Amministratore" : "Shop Assistant";
  lead.textContent = admin ? "Password riservata all'amministratore." : "Password del negozio e PIN del punto vendita.";
  document.getElementById("switchMode").textContent = admin ? "Accesso shop assistant" : "Accesso amministratore";
  err.textContent = "";
}
paint();
document.getElementById("switchMode").addEventListener("click", ()=>{ admin = !admin; paint(); });
async function enter(url, body, next){
  err.textContent = "";
  const res = await fetch(url, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ err.textContent = data.error || "Accesso non riuscito"; return; }
  location.href = next;
}
shopForm.addEventListener("submit", (e)=>{
  e.preventDefault();
  const fd = new FormData(shopForm);
  enter("/api/login", {password:fd.get("password"), pin:fd.get("pin")}, "/negozio");
});
adminForm.addEventListener("submit", (e)=>{
  e.preventDefault();
  const fd = new FormData(adminForm);
  enter("/api/admin/login", {password:fd.get("password")}, "/admin");
});
</script>
</body>
</html>
