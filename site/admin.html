<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amministrazione — Preventivatore</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff8d6;color:#1c1a14}
  main{max-width:880px;margin:0 auto;padding:32px 18px 60px}
  h1{margin:0 0 8px}
  a.btn,button{font:inherit;font-weight:800;background:#FFD000;border:0;border-radius:12px;padding:12px 16px;text-decoration:none;color:#111;display:inline-block;cursor:pointer}
  button.secondary{background:#fff;border:1px solid #e2d48a}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0e7b8;font-size:14px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;padding:16px;border-radius:16px;margin-top:16px}
  label{display:grid;gap:4px;font-size:13px;font-weight:700}
  input{font:inherit;padding:10px;border:1px solid #e2d48a;border-radius:10px}
  .full{grid-column:1 / -1}
  .note{color:#4a4638}
  @media(max-width:680px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Amministrazione</h1>
  <p class="note">I negozi vedono tutti i preventivi. Ognuno modifica ed elimina solo i propri. Tu puoi intervenire su tutti.</p>
  <div class="row">
    <a class="btn" href="/listini">Aggiorna le offerte</a>
    <a class="btn" href="/negozio">Apri il gestionale</a>
    <button class="secondary" id="logout" type="button">Esci</button>
  </div>
  <h2>Negozi</h2>
  <table><thead><tr><th>Negozio</th><th>Indirizzo</th><th>Email</th><th>Telefono</th><th>PIN</th><th></th></tr></thead><tbody id="rows"></tbody></table>
  <h2>Nuovo negozio o aggiornamento</h2>
  <form id="shopForm">
    <input type="hidden" name="id" id="shopId">
    <label>Nome<input name="name" required></label>
    <label>PIN<input name="pin" autocomplete="off" placeholder="Lascia vuoto per non cambiarlo"></label>
    <label>Indirizzo<input name="address"></label>
    <label>Email<input name="email" type="email"></label>
    <label>Telefono<input name="phone"></label>
    <div class="full"><button type="submit">Salva negozio</button> <button class="secondary" id="reset" type="button">Pulisci</button></div>
    <p class="full note" id="msg"></p>
  </form>
</main>
<script>
const rows = document.getElementById("rows");
const form = document.getElementById("shopForm");
const msg = document.getElementById("msg");
async function api(url, opts){
  const res = await fetch(url, Object.assign({credentials:"same-origin"}, opts||{}));
  if(res.status === 401){ location.href = "/accesso?admin=1"; throw Error("Accesso scaduto"); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw Error(data.error || "Operazione non riuscita");
  return data;
}
function paint(shops){
  rows.innerHTML = shops.map(s => `<tr>
    <td>${s.name}</td><td>${s.address}</td><td>${s.email}</td><td>${s.phone}</td>
    <td>${s.hasPin ? "impostato" : "manca"}</td>
    <td><button type="button" data-id="${s.id}">Modifica</button></td>
  </tr>`).join("");
  rows.querySelectorAll("button").forEach(btn => btn.addEventListener("click", ()=>{
    const s = shops.find(x => x.id === btn.dataset.id);
    form.id.value = s.id;
    form.name.value = s.name;
    form.address.value = s.address;
    form.email.value = s.email;
    form.phone.value = s.phone;
    form.pin.value = "";
  }));
}
async function load(){
  const data = await api("/api/shops");
  paint(data.shops);
}
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  msg.textContent = "";
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  if(!body.pin) delete body.pin;
  if(!body.id) delete body.id;
  try{
    const data = await api("/api/shops", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    paint(data.shops);
    form.reset();
    msg.textContent = "Negozio salvato.";
  }catch(err){ msg.textContent = err.message; }
});
document.getElementById("reset").addEventListener("click", ()=>{ form.reset(); msg.textContent = ""; });
document.getElementById("logout").addEventListener("click", async ()=>{
  await fetch("/api/logout", {method:"POST", credentials:"same-origin"});
  location.href = "/";
});
load().catch(err => { msg.textContent = err.message; });
</script>
</body>
</html>
